name: Central Wiki Sync Logic

on:
  workflow_call:
    inputs:
      source_repo:
        required: false
        type: string
        default: "infinition/AcidWiki"

permissions:
  contents: write   # REQUIS : Pour créer et commiter .github/acidwiki.json
  pages: write      # REQUIS : Pour déployer _site
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caller Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout AcidWiki Engine
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          path: temp_engine
          ref: main

      - name: Auto-Onboarding (Create config if missing)
        run: |
          mkdir -p .github
          if [ ! -f ".github/acidwiki.json" ]; then
            echo "⚠️ .github/acidwiki.json introuvable. Création par défaut..."
            
            # Copie depuis le moteur vers le dossier .github/ de TON repo
            if [ -f "temp_engine/acidwiki.json" ]; then
              cp temp_engine/acidwiki.json .github/acidwiki.json
            else
              cat <<EOF > .github/acidwiki.json
              {
                "debug": false,
                "social": {
                  "discord": null,
                  "reddit": null
                },
                "buymeacoffee": "https://buymeacoffee.com/infinition"
              }
          EOF
            fi
            
            # Commit automatique sur ton repo
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .github/acidwiki.json
            git commit -m "chore: auto-onboarding acidwiki.json [skip ci]"
            git push
          else
            echo "✅ Configuration .github/acidwiki.json existante trouvée."
          fi

      - name: Assemble Site Directory
        run: |
          echo "📦 Assemblage du site centralisé dans _site/ ..."
          mkdir -p _site _site/wiki
          
          # 1. Copie des fichiers racine du moteur
          cp -fv temp_engine/index.html _site/
          cp -fv temp_engine/sw.js _site/ || true
          cp -fv temp_engine/robots.txt _site/ || true
          cp -fv temp_engine/.nojekyll _site/ || true
          if [ -f "temp_engine/security.txt" ]; then cp -fv temp_engine/security.txt _site/ ; fi
          if [ -d "temp_engine/.well-known" ]; then cp -rn temp_engine/.well-known _site/ || true ; fi
          
          # 2. Copie du contenu système du wiki
          if [ -d "temp_engine/wiki" ]; then
             cp -a temp_engine/wiki/* _site/wiki/
          fi
          
          # 3. Fusion avec tes pages locales
          if [ -d "wiki" ]; then
            echo "📂 Copie du contenu wiki local..."
            cp -a wiki/* _site/wiki/ || true
          fi

          # 4. Le logo du moteur ne doit pas usurper l'identite du repo appelant.
          # Sans ca, wiki/assets/logo.png existe toujours et l'auto-detection du
          # logo depuis le README n'est jamais atteinte. On le degrade en dernier
          # recours, sauf si le repo appelant fournit reellement son propre logo.
          if [ ! -f "wiki/assets/logo.png" ] && [ -f "_site/wiki/assets/logo.png" ]; then
            echo "🎨 Aucun logo local : le logo AcidWiki devient le fallback final."
            mv _site/wiki/assets/logo.png _site/wiki/assets/logo-fallback.png
          fi

      - name: Dynamic Config Injection
        working-directory: ./_site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
        run: |
          CONFIG_FILE="wiki/config.js"
          JSON_FILE="../.github/acidwiki.json"
          MANIFEST_FILE="wiki/manifest.pwa.json"
          
          REPO_NAME=$(echo "$REPO_FULL" | awk -F '/' '{print $2}')
          YEAR=$(date +'%Y')
          
          # --- SECURITE ANTI-CRASH JAVASCRIPT (Unexpected identifier 'message') ---
          LATEST_TAG=$(gh api repos/$REPO_FULL/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          if [[ "$LATEST_TAG" == *"message"* || "$LATEST_TAG" == *"{"* || "$LATEST_TAG" == "null" ]]; then
            LATEST_TAG=""
          fi
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(gh api repos/$REPO_FULL/tags --jq '.[0].name' 2>/dev/null || echo "")
            if [[ "$LATEST_TAG" == *"message"* || "$LATEST_TAG" == *"{"* || "$LATEST_TAG" == "null" ]]; then
              LATEST_TAG=""
            fi
          fi
          
          # --- LECTURE SECURISEE DU JSON ---
          DISCORD=$(jq -r '.social.discord // empty' "$JSON_FILE" 2>/dev/null || echo "")
          REDDIT=$(jq -r '.social.reddit // empty' "$JSON_FILE" 2>/dev/null || echo "")
          COFFEE=$(jq -r '.buymeacoffee // empty' "$JSON_FILE" 2>/dev/null || echo "")
          DEBUG_MODE=$(jq -r '.debug // "false"' "$JSON_FILE" 2>/dev/null || echo "false")
          
          # --- INJECTION ---
          sed -i "s|projectName: \".*\"|projectName: \"${REPO_NAME^^}\"|g" $CONFIG_FILE
          sed -i "s|projectSubtitle: \".*\"|projectSubtitle: \"${REPO_NAME^^} WIKI\"|g" $CONFIG_FILE
          sed -i "s|description: \".*\"|description: \"Official Documentation and Wiki for ${REPO_NAME}\"|g" $CONFIG_FILE
          sed -i "s|repo: \".*\"|repo: \"$REPO_FULL\"|g" $CONFIG_FILE
          sed -i "s|footerText: \".*\"|footerText: \"© $YEAR ${REPO_NAME^^} WIKI - All rights reserved\"|g" $CONFIG_FILE
          sed -i "s|github: \".*\"|github: \"https://github.com/$REPO_FULL\"|g" $CONFIG_FILE
          sed -i "s|githubLabel: \".*\"|githubLabel: \"${REPO_NAME^^}\"|g" $CONFIG_FILE
          sed -i "s|debug: false|debug: $DEBUG_MODE|g" $CONFIG_FILE
          
          # Gestion parfaite des variables nulles
          if [ -n "$DISCORD" ] && [ "$DISCORD" != "null" ]; then sed -i "s|discord: .*|discord: \"$DISCORD\",|g" $CONFIG_FILE; else sed -i "s|discord: .*|discord: null,|g" $CONFIG_FILE; fi
          if [ -n "$REDDIT" ] && [ "$REDDIT" != "null" ]; then sed -i "s|reddit: .*|reddit: \"$REDDIT\",|g" $CONFIG_FILE; else sed -i "s|reddit: .*|reddit: null,|g" $CONFIG_FILE; fi
          if [ -n "$COFFEE" ] && [ "$COFFEE" != "null" ]; then sed -i "s|buyMeACoffee: .*|buyMeACoffee: \"$COFFEE\"|g" $CONFIG_FILE; else sed -i "s|buyMeACoffee: .*|buyMeACoffee: null|g" $CONFIG_FILE; fi
          
          sed -i "s|top: \[.*|top: [],|g" $CONFIG_FILE
          sed -i "s|bottom: \[.*|bottom: []|g" $CONFIG_FILE
          sed -i "s|type: \"github\"|type: \"local\"|g" $CONFIG_FILE
          
          CURRENT_DATE=$(date +'%Y-%m-%d')
          sed -i "s|manualDate: \".*\"|manualDate: \"$CURRENT_DATE\"|g" $CONFIG_FILE
          
          if [ -n "$LATEST_TAG" ]; then
            sed -i "s|manualVersion: \".*\"|manualVersion: \"$LATEST_TAG\"|g" $CONFIG_FILE
          else
            sed -i "s|manualVersion: \".*\"|manualVersion: \"\"|g" $CONFIG_FILE
          fi

          # CORRECTION ERREUR 404 LOGO PWA
          if [ -f "$MANIFEST_FILE" ]; then
            jq --arg name "${REPO_NAME^^} WIKI" --arg short "$REPO_NAME" --arg icon "assets/logo.png" '
              .name = $name | 
              .short_name = $short | 
              if .icons then (.icons[].src = $icon) else . end | 
              if .shortcuts then (.shortcuts[].icons[].src = $icon) else . end
            ' $MANIFEST_FILE > manifest.tmp && mv manifest.tmp $MANIFEST_FILE
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
