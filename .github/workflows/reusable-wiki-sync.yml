name: Central Wiki Sync Logic

on:
  workflow_call:
    inputs:
      source_repo:
        required: false
        type: string
        default: "infinition/AcidWiki"

# Permissions minimales : On ne modifie plus le code source, on écrit juste sur Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caller Repository (Ton repo cible)
        uses: actions/checkout@v4

      - name: Create Build Directory
        run: mkdir -p _site

      - name: Checkout AcidWiki Engine (Le moteur)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          path: temp_engine
          ref: main

      - name: Assemble Site in temporary folder
        run: |
          echo "📦 Assemblage du site dans _site/ ..."
          
          # 1. On copie tout le moteur de base dans _site
          cp -a temp_engine/* _site/
          cp -a temp_engine/.nojekyll _site/ || true
          cp -a temp_engine/.well-known _site/ || true
          
          # 2. On écrase avec tes pages de wiki locales
          if [ -d "wiki" ]; then
            echo "Copie du dossier wiki local..."
            cp -a wiki/* _site/wiki/ || true
          fi
          
          # 3. Récupération de la config depuis .github/
          if [ -f ".github/acidwiki.json" ]; then
            echo "✅ Configuration .github/acidwiki.json trouvée."
            cp .github/acidwiki.json _site/acidwiki.json
          else
            echo "⚠️ Création d'une configuration par défaut..."
            echo '{"debug": false, "social": {"discord": null, "reddit": null}, "buymeacoffee": "https://buymeacoffee.com/infinition"}' > _site/acidwiki.json
          fi

      - name: Dynamic Config Injection
        working-directory: ./_site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
        run: |
          CONFIG_FILE="wiki/config.js"
          JSON_FILE="acidwiki.json"
          MANIFEST_FILE="wiki/manifest.pwa.json"
          
          REPO_NAME=$(echo "$REPO_FULL" | awk -F '/' '{print $2}')
          YEAR=$(date +'%Y')
          
          TAG_REL=$(gh api repos/$REPO_FULL/releases/latest --jq .tag_name 2>/dev/null || echo "")
          LATEST_TAG=${TAG_REL:-""}
          
          DISCORD=$(jq -r '.social.discord // empty' $JSON_FILE)
          REDDIT=$(jq -r '.social.reddit // empty' $JSON_FILE)
          COFFEE=$(jq -r '.buymeacoffee // "https://buymeacoffee.com/infinition"' $JSON_FILE)
          DEBUG_MODE=$(jq -r '.debug' $JSON_FILE)
          
          # INJECTION JS
          sed -i "s|projectName: \".*\"|projectName: \"${REPO_NAME^^}\"|g" $CONFIG_FILE
          sed -i "s|projectSubtitle: \".*\"|projectSubtitle: \"${REPO_NAME^^} WIKI\"|g" $CONFIG_FILE
          sed -i "s|description: \".*\"|description: \"Official Documentation and Wiki for ${REPO_NAME}\"|g" $CONFIG_FILE
          sed -i "s|repo: \".*\"|repo: \"$REPO_FULL\"|g" $CONFIG_FILE
          sed -i "s|footerText: \".*\"|footerText: \"© $YEAR ${REPO_NAME^^} WIKI - All rights reserved\"|g" $CONFIG_FILE
          sed -i "s|github: \".*\"|github: \"https://github.com/$REPO_FULL\"|g" $CONFIG_FILE
          sed -i "s|githubLabel: \".*\"|githubLabel: \"${REPO_NAME^^}\"|g" $CONFIG_FILE
          sed -i "s|buyMeACoffee: \".*\"|buyMeACoffee: \"$COFFEE\"|g" $CONFIG_FILE
          sed -i "s|debug: false|debug: $DEBUG_MODE|g" $CONFIG_FILE
          
          if [ -n "$DISCORD" ]; then sed -i "s|discord: .*|discord: \"$DISCORD\",|g" $CONFIG_FILE; fi
          if [ -n "$REDDIT" ]; then sed -i "s|reddit: .*|reddit: \"$REDDIT\",|g" $CONFIG_FILE; fi
          
          sed -i "s|top: \[.*|top: [],|g" $CONFIG_FILE
          sed -i "s|bottom: \[.*|bottom: []|g" $CONFIG_FILE
          sed -i "s|type: \"github\"|type: \"local\"|g" $CONFIG_FILE
          
          # Date du jour (plus besoin de logique complexe, on ne commit rien)
          CURRENT_DATE=$(date +'%Y-%m-%d')
          sed -i "s|manualDate: \".*\"|manualDate: \"$CURRENT_DATE\"|g" $CONFIG_FILE
          
          if [ -n "$LATEST_TAG" ]; then
            sed -i "s|manualVersion: \".*\"|manualVersion: \"$LATEST_TAG\"|g" $CONFIG_FILE
          else
            sed -i "s|manualVersion: \".*\"|manualVersion: \"\"|g" $CONFIG_FILE
          fi

          # INJECTION MANIFEST PWA
          if [ -f "$MANIFEST_FILE" ]; then
            jq --arg name "${REPO_NAME^^} WIKI" --arg short "$REPO_NAME" '.name = $name | .short_name = $short' $MANIFEST_FILE > manifest.tmp && mv manifest.tmp $MANIFEST_FILE
          fi

          # SÉCURITÉ
          EXP_DATE=$(date -d "+1 year" -u +"%Y-%m-%dT%H:%M:%S.000Z")
          if [ -f "security.txt" ]; then 
            sed -i "s|infinition/AcidWiki|$REPO_FULL|g" security.txt
            sed -i "s|Expires: .*|Expires: $EXP_DATE|g" security.txt
          fi
          if [ -f ".well-known/security.txt" ]; then 
            sed -i "s|infinition/AcidWiki|$REPO_FULL|g" .well-known/security.txt
            sed -i "s|Expires: .*|Expires: $EXP_DATE|g" .well-known/security.txt
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
