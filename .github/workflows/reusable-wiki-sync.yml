name: Central Wiki Sync Logic

on:
  workflow_call:
    inputs:
      source_repo:
        required: false
        type: string
        default: "infinition/AcidWiki"

permissions:
  contents: write   # OBLIGATOIRE : Pour pouvoir commiter le .github/acidwiki.json s'il est manquant
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caller Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important pour pouvoir faire un git push

      - name: Auto-Onboarding (Create config if missing)
        run: |
          mkdir -p .github
          if [ ! -f ".github/acidwiki.json" ]; then
            echo "⚠️ .github/acidwiki.json introuvable. Création et commit de la configuration par défaut..."
            cat <<EOF > .github/acidwiki.json
            {
              "debug": false,
              "social": {
                "discord": null,
                "reddit": null
              },
              "buymeacoffee": "https://buymeacoffee.com/infinition"
            }
          EOF
            
            # Commit et push sur le repo appelant
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .github/acidwiki.json
            git commit -m "chore: auto-create acidwiki.json config [skip ci]"
            git push
          else
            echo "✅ Configuration .github/acidwiki.json existante trouvée. Aucune modification."
          fi

      - name: Checkout AcidWiki Engine
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          path: temp_engine
          ref: main

      - name: Assemble Site Directory
        run: |
          echo "📦 Assemblage du site centralisé dans _site/ ..."
          mkdir -p _site _site/wiki
          
          # 1. Copie des fichiers racine du moteur (index.html, sw.js, etc.)
          cp -fv temp_engine/index.html _site/
          cp -fv temp_engine/sw.js _site/ || true
          cp -fv temp_engine/robots.txt _site/ || true
          cp -fv temp_engine/.nojekyll _site/ || true
          if [ -f "temp_engine/security.txt" ]; then cp -fv temp_engine/security.txt _site/ ; fi
          if [ -d "temp_engine/.well-known" ]; then cp -rn temp_engine/.well-known _site/ || true ; fi
          
          # 2. Copie du contenu système du wiki (thèmes, scripts, config par défaut)
          if [ -d "temp_engine/wiki" ]; then
             cp -a temp_engine/wiki/* _site/wiki/
          fi
          
          # 3. Fusion avec le contenu de TON repo (tes .md dans wiki/docs)
          if [ -d "wiki" ]; then
            echo "📂 Copie du contenu wiki local..."
            cp -a wiki/* _site/wiki/ || true
          fi

      - name: Dynamic Config Injection
        working-directory: ./_site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
        run: |
          CONFIG_FILE="wiki/config.js"
          JSON_FILE="../.github/acidwiki.json" # Le script pointe vers ton dossier .github !
          MANIFEST_FILE="wiki/manifest.pwa.json"
          
          REPO_NAME=$(echo "$REPO_FULL" | awk -F '/' '{print $2}')
          YEAR=$(date +'%Y')
          
          TAG_REL=$(gh api repos/$REPO_FULL/releases/latest --jq .tag_name 2>/dev/null || echo "")
          LATEST_TAG=${TAG_REL:-""}
          
          # Lecture des variables de TON fichier acidwiki.json
          DISCORD=$(jq -r '.social.discord // empty' $JSON_FILE)
          REDDIT=$(jq -r '.social.reddit // empty' $JSON_FILE)
          COFFEE=$(jq -r '.buymeacoffee // "https://buymeacoffee.com/infinition"' $JSON_FILE)
          DEBUG_MODE=$(jq -r '.debug' $JSON_FILE)
          
          # INJECTION JS
          sed -i "s|projectName: \".*\"|projectName: \"${REPO_NAME^^}\"|g" $CONFIG_FILE
          sed -i "s|projectSubtitle: \".*\"|projectSubtitle: \"${REPO_NAME^^} WIKI\"|g" $CONFIG_FILE
          sed -i "s|description: \".*\"|description: \"Official Documentation and Wiki for ${REPO_NAME}\"|g" $CONFIG_FILE
          sed -i "s|repo: \".*\"|repo: \"$REPO_FULL\"|g" $CONFIG_FILE
          sed -i "s|footerText: \".*\"|footerText: \"© $YEAR ${REPO_NAME^^} WIKI - All rights reserved\"|g" $CONFIG_FILE
          sed -i "s|github: \".*\"|github: \"https://github.com/$REPO_FULL\"|g" $CONFIG_FILE
          sed -i "s|githubLabel: \".*\"|githubLabel: \"${REPO_NAME^^}\"|g" $CONFIG_FILE
          sed -i "s|buyMeACoffee: \".*\"|buyMeACoffee: \"$COFFEE\"|g" $CONFIG_FILE
          sed -i "s|debug: false|debug: $DEBUG_MODE|g" $CONFIG_FILE
          
          if [ -n "$DISCORD" ]; then sed -i "s|discord: .*|discord: \"$DISCORD\",|g" $CONFIG_FILE; else sed -i "s|discord: .*|discord: null,|g" $CONFIG_FILE; fi
          if [ -n "$REDDIT" ]; then sed -i "s|reddit: .*|reddit: \"$REDDIT\",|g" $CONFIG_FILE; else sed -i "s|reddit: .*|reddit: null,|g" $CONFIG_FILE; fi
          
          sed -i "s|top: \[.*|top: [],|g" $CONFIG_FILE
          sed -i "s|bottom: \[.*|bottom: []|g" $CONFIG_FILE
          sed -i "s|type: \"github\"|type: \"local\"|g" $CONFIG_FILE
          
          CURRENT_DATE=$(date +'%Y-%m-%d')
          sed -i "s|manualDate: \".*\"|manualDate: \"$CURRENT_DATE\"|g" $CONFIG_FILE
          
          if [ -n "$LATEST_TAG" ]; then
            sed -i "s|manualVersion: \".*\"|manualVersion: \"$LATEST_TAG\"|g" $CONFIG_FILE
          else
            sed -i "s|manualVersion: \".*\"|manualVersion: \"\"|g" $CONFIG_FILE
          fi

          # INJECTION MANIFEST PWA
          if [ -f "$MANIFEST_FILE" ]; then
            jq --arg name "${REPO_NAME^^} WIKI" --arg short "$REPO_NAME" '.name = $name | .short_name = $short' $MANIFEST_FILE > manifest.tmp && mv manifest.tmp $MANIFEST_FILE
          fi

          # SÉCURITÉ
          EXP_DATE=$(date -d "+1 year" -u +"%Y-%m-%dT%H:%M:%S.000Z")
