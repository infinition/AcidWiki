name: Central Wiki Sync Logic

on:
  workflow_call:
    inputs:
      source_repo:
        required: false
        type: string
        default: "infinition/AcidWiki"

permissions:
  contents: write   # REQUIS : Pour créer et commiter .github/acidwiki.json
  pages: write      # REQUIS : Pour déployer _site
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Caller Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout AcidWiki Engine
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          path: temp_engine
          ref: main

      - name: Auto-Onboarding (Create config if missing)
        run: |
          mkdir -p .github
          if [ ! -f ".github/acidwiki.json" ]; then
            echo "⚠️ .github/acidwiki.json introuvable. Création par défaut..."
            
            # Copie depuis le moteur vers le dossier .github/ de TON repo
            if [ -f "temp_engine/acidwiki.json" ]; then
              cp temp_engine/acidwiki.json .github/acidwiki.json
            else
              cat <<EOF > .github/acidwiki.json
              {
                "debug": false,
                "social": {
                  "discord": null,
                  "reddit": null
                },
                "buymeacoffee": "https://buymeacoffee.com/infinition"
              }
          EOF
            fi
            
            # Commit automatique sur ton repo
            git config --local user.email "action@github.com"
            git config --local user.name "GitHub Action"
            git add .github/acidwiki.json
            git commit -m "chore: auto-onboarding acidwiki.json [skip ci]"
            git push
          else
            echo "✅ Configuration .github/acidwiki.json existante trouvée."
          fi

      - name: Assemble Site Directory
        run: |
          echo "📦 Assemblage du site centralisé dans _site/ ..."
          mkdir -p _site _site/wiki
          
          # 1. Copie des fichiers racine du moteur
          cp -fv temp_engine/index.html _site/
          cp -fv temp_engine/sw.js _site/ || true
          cp -fv temp_engine/robots.txt _site/ || true
          cp -fv temp_engine/.nojekyll _site/ || true
          if [ -f "temp_engine/security.txt" ]; then cp -fv temp_engine/security.txt _site/ ; fi
          if [ -d "temp_engine/.well-known" ]; then cp -rn temp_engine/.well-known _site/ || true ; fi
          
          # 2. Copie du contenu système du wiki
          if [ -d "temp_engine/wiki" ]; then
             cp -a temp_engine/wiki/* _site/wiki/
          fi
          
          # 3. Fusion avec tes pages locales
          if [ -d "wiki" ]; then
            echo "📂 Copie du contenu wiki local..."
            cp -a wiki/* _site/wiki/ || true
          fi

          # 3a. Markdown pose a la racine du depot appelant (README et compagnie).
          # Le moteur les lit d'abord sur raw.githubusercontent, mais les copier ici
          # les rend visibles de l'index statique et sert de repli si raw tombe.
          for f in *.md; do
            [ -f "$f" ] && cp -f "$f" _site/ || true
          done

          # 3b. Idem pour docs/, l'autre racine de contenu reconnue par le moteur.
          # Le moteur lit desormais le markdown depuis raw.githubusercontent, donc
          # cette copie n'est qu'un repli : elle sert la preview locale et le cas ou
          # raw est injoignable. Elle evite surtout qu'une page decouverte via l'API
          # n'existe nulle part sur le site deploye.
          if [ -d "docs" ]; then
            echo "📂 Copie du contenu docs local..."
            mkdir -p _site/docs
            cp -a docs/* _site/docs/ || true
          fi

          # 4. Le logo du moteur ne doit pas usurper l'identite du repo appelant.
          # Sans ca, wiki/assets/logo.png existe toujours et l'auto-detection du
          # logo depuis le README n'est jamais atteinte. On le degrade en dernier
          # recours, sauf si le repo appelant fournit reellement son propre logo.
          if [ ! -f "wiki/assets/logo.png" ] && [ -f "_site/wiki/assets/logo.png" ]; then
            echo "🎨 Aucun logo local : le logo AcidWiki devient le fallback final."
            mv _site/wiki/assets/logo.png _site/wiki/assets/logo-fallback.png
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dynamic Config Injection
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
        run: |
          # La version affichee vient de la derniere release, a defaut du dernier
          # tag. L'API renvoie un objet d'erreur quand il n'y a ni l'un ni l'autre :
          # on ne garde que ce qui ressemble reellement a un numero de version, le
          # generateur de configuration refuse le reste de toute facon.
          LATEST_TAG=$(gh api "repos/$REPO_FULL/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")
          if [ -z "$LATEST_TAG" ]; then
            LATEST_TAG=$(gh api "repos/$REPO_FULL/tags" --jq '.[0].name' 2>/dev/null || echo "")
          fi
          case "$LATEST_TAG" in
            *message*|*'{'*|null) LATEST_TAG="" ;;
          esac

          # Le gabarit est evalue puis reserialise. Les anciens sed operaient sur du
          # JavaScript : une barre verticale ou un guillemet dans une URL de config
          # produisait un fichier inanalysable, et le wiki se deployait vide.
          node temp_engine/tools/apply-config.mjs \
            --config .github/acidwiki.json \
            --target _site/wiki/config.js \
            --repo "$REPO_FULL" \
            --version "$LATEST_TAG"

          # Manifeste PWA : nom du depot et icone reellement presente sur le site.
          MANIFEST_FILE="_site/wiki/manifest.pwa.json"
          REPO_NAME=$(echo "$REPO_FULL" | awk -F '/' '{print $2}')
          if [ -f "$MANIFEST_FILE" ]; then
            jq --arg name "$(echo "$REPO_NAME" | tr '[:lower:]' '[:upper:]') WIKI" \
               --arg short "$REPO_NAME" \
               --arg icon "assets/logo.png" '
              .name = $name |
              .short_name = $short |
              if .icons then (.icons[].src = $icon) else . end |
              if .shortcuts then (.shortcuts[].icons[].src = $icon) else . end
            ' "$MANIFEST_FILE" > manifest.tmp && mv manifest.tmp "$MANIFEST_FILE"
          fi

      - name: Build static content index
        run: |
          # Sans index, chaque visiteur interroge l'API GitHub pour l'arborescence
          # puis une fois par page pour la date de derniere edition : soixante
          # requetes par heure et par adresse, plafond vite atteint. L'index est
          # construit une fois ici et le site n'appelle plus rien.
          node temp_engine/tools/build-index.mjs --root _site --out _site/wiki/index.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
